<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SoroAnalytics</title><style>body{font:15px system-ui;background:#f5f7fb;color:#182238;max-width:1000px;margin:40px auto;padding:0 20px}.panel{background:white;border:1px solid #e3e8f0;border-radius:16px;padding:22px;margin:18px 0}button,input{padding:11px;border:1px solid #dce2ed;border-radius:9px}button{background:#4169f5;color:white}table{border-collapse:collapse;width:100%;overflow:auto}td,th{padding:9px;border-bottom:1px solid #e8ecf3;text-align:left}canvas{width:100%}small{color:#718096}</style><h1>◈ SoroAnalytics</h1><p>Explore CSV data locally in your browser.</p><section class="panel"><input type="file" id="file" accept=".csv,text/csv"><p id="stats">Choose a CSV file to begin.</p><div style="overflow:auto" id="table"></div><select id="col"><option>Select numeric column</option></select><canvas id="chart" width="900" height="260"></canvas></section><script>const $=s=>document.querySelector(s);let rows=[],heads=[];function parse(t){let a=[],r=[],v='',q=false;for(let i=0;i<t.length;i++){let c=t[i];if(c==='"'&&q&&t[i+1]==='"'){v+='"';i++}else if(c==='"')q=!q;else if(c===','&&!q){r.push(v);v=''}else if((c==='\\n'||c==='\\r')&&!q){if(c==='\\r'&&t[i+1]==='\\n')i++;r.push(v);if(r.some(x=>x))a.push(r);r=[];v=''}else v+=c}r.push(v);if(r.some(x=>x))a.push(r);return a}$('#file').onchange=async e=>{let a=parse(await e.target.files[0].text());heads=a.shift()||[];rows=a;$('#stats').textContent=rows.length+' rows · '+heads.length+' columns';$('#table').innerHTML='<table><thead><tr>'+heads.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(0,10).map(r=>'<tr>'+heads.map((_,i)=>'<td>'+((r[i]||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])))+'</td>').join('')+'</tr>').join('')+'</tbody></table>';let ns=heads.filter((h,i)=>rows.every(r=>!r[i]||Number.isFinite(Number(r[i]))));$('#col').innerHTML='<option>Select numeric column</option>'+ns.map(x=>'<option>'+x+'</option>').join('')};$('#col').onchange=()=>{let i=heads.indexOf($('#col').value),v=rows.map(r=>+r[i]).filter(Number.isFinite).slice(0,50),c=$('#chart').getContext('2d');c.clearRect(0,0,900,260);let m=Math.max(1,...v);c.fillStyle='#4169f5';v.forEach((x,j)=>c.fillRect(10+j*880/v.length,245-x/m*220,Math.max(2,880/v.length-3),x/m*220))}</script>
