<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SoroAnalytics</title><style>body{font:15px system-ui;background:#f5f7fb;color:#182238;max-width:1000px;margin:40px auto;padding:0 20px}.panel{background:white;border:1px solid #e3e8f0;border-radius:16px;padding:22px;margin:18px 0}button,input{padding:11px;border:1px solid #dce2ed;border-radius:9px}button{background:#4169f5;color:white}table{border-collapse:collapse;width:100%;overflow:auto}td,th{padding:9px;border-bottom:1px solid #e8ecf3;text-align:left}canvas{width:100%}small{color:#718096}</style>
<style id="soro-polish">
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');
:root{--accent:#4b91e8;--accent-soft:color-mix(in srgb,var(--accent) 13%,transparent);--ink:#edf2ff;--muted:#98a6c2;--line:#27334d;--bg:#080d19;--card:#101a2b;--glow:color-mix(in srgb,var(--accent) 30%,transparent)}
html{scroll-behavior:smooth}body{font-family:'DM Sans',Inter,system-ui,sans-serif!important;background:radial-gradient(ellipse at 12% 0%,var(--glow),transparent 34%),radial-gradient(ellipse at 92% 90%,#23365a66,transparent 36%),#080d19!important;color:var(--ink)!important;min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.16;background-image:linear-gradient(#91a8d10d 1px,transparent 1px),linear-gradient(90deg,#91a8d10d 1px,transparent 1px);background-size:38px 38px;mask-image:linear-gradient(to bottom,black,transparent 90%)}
h1,h2,h3,.brand,header b{font-family:'Space Grotesk','DM Sans',sans-serif!important;letter-spacing:-.045em}
h1{line-height:1.04!important}h1 span,.brand span{background:linear-gradient(100deg,var(--accent),#d7e2ff 75%);-webkit-background-clip:text;background-clip:text;color:transparent!important}
p{line-height:1.7}button,.upload,.pill{transition:transform .22s ease,border-color .22s ease,background .22s ease,box-shadow .22s ease}
button:hover,.upload:hover{transform:translateY(-2px);box-shadow:0 9px 28px var(--glow)}button:active{transform:scale(.97)}
button.primary,.primary,.send,.upload{background:linear-gradient(115deg,var(--accent),color-mix(in srgb,var(--accent) 62%,#263d78))!important;border-color:transparent!important;color:#fff!important}
input,textarea,select{background:#0d1628!important;color:#edf2ff!important;border-color:#2b3955!important}
input::placeholder,textarea::placeholder{color:#7786a3!important}
.panel,.window,.msg,.bubble,.file,.person,.composer,.side,.dock,.chat aside,.chat main header,.app>header,.preview,.editor,.stat,.tasks{border-color:#283650!important}
.panel,.window,.msg,.bubble,.file,.person,.composer{box-shadow:0 14px 40px #0002!important}
.panel,.file,.window{background:linear-gradient(145deg,#121f34ee,#0e1728ee)!important;backdrop-filter:blur(14px)}
.muted,small,.eyebrow,footer{color:#94a3bf!important}
.pill{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 38%,transparent)!important;color:#dce5ff!important}
a{color:var(--accent)}::selection{background:var(--accent);color:white}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.brand{display:inline-flex;align-items:center;gap:9px}
.brand:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 18px var(--accent)}
.hero{animation:soroRise .8s cubic-bezier(.2,.75,.2,1) both}
@keyframes soroRise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.reveal{opacity:0;transform:translateY(14px);transition:opacity .65s ease,transform .65s cubic-bezier(.2,.7,.2,1)}
.reveal.visible{opacity:1;transform:none}
.orb{filter:drop-shadow(0 0 22px var(--accent));animation:soroFloat 4s ease-in-out infinite}
@keyframes soroFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.panel:hover{border-color:color-mix(in srgb,var(--accent) 55%,#283650)!important}

@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style><script id="soro-motion">(()=>{const nodes='section,.panel,.stat,.tasks,.file,.window,.person,.hero,canvas'.split(',').flatMap(s=>[...document.querySelectorAll(s)]);const unique=[...new Set(nodes)].filter(n=>!n.closest('.side'));if(!('IntersectionObserver'in window)){unique.forEach(n=>n.classList.add('visible'));return}const io=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');io.unobserve(e.target)}}),{threshold:.08});unique.forEach(n=>{n.classList.add('reveal');io.observe(n)});})();</script><h1>◈ SoroAnalytics</h1><p>Explore CSV data locally in your browser.</p><section class="panel"><input type="file" id="file" accept=".csv,text/csv"><p id="stats">Choose a CSV file to begin.</p><div style="overflow:auto" id="table"></div><select id="col"><option>Select numeric column</option></select><canvas id="chart" width="900" height="260"></canvas></section><script>const $=s=>document.querySelector(s);let rows=[],heads=[];function parse(t){let a=[],r=[],v='',q=false;for(let i=0;i<t.length;i++){let c=t[i];if(c==='"'&&q&&t[i+1]==='"'){v+='"';i++}else if(c==='"')q=!q;else if(c===','&&!q){r.push(v);v=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&t[i+1]==='\n')i++;r.push(v);if(r.some(x=>x))a.push(r);r=[];v=''}else v+=c}r.push(v);if(r.some(x=>x))a.push(r);return a}$('#file').onchange=async e=>{let a=parse(await e.target.files[0].text());heads=a.shift()||[];rows=a;$('#stats').textContent=rows.length+' rows · '+heads.length+' columns';$('#table').innerHTML='<table><thead><tr>'+heads.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(0,10).map(r=>'<tr>'+heads.map((_,i)=>'<td>'+((r[i]||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])))+'</td>').join('')+'</tr>').join('')+'</tbody></table>';let ns=heads.filter((h,i)=>rows.every(r=>!r[i]||Number.isFinite(Number(r[i]))));$('#col').innerHTML='<option>Select numeric column</option>'+ns.map(x=>'<option>'+x+'</option>').join('')};$('#col').onchange=()=>{let i=heads.indexOf($('#col').value),v=rows.map(r=>+r[i]).filter(Number.isFinite).slice(0,50),c=$('#chart').getContext('2d');c.clearRect(0,0,900,260);let m=Math.max(1,...v);c.fillStyle='#4169f5';v.forEach((x,j)=>c.fillRect(10+j*880/v.length,245-x/m*220,Math.max(2,880/v.length-3),x/m*220))}</script>
